backend = "xrender";
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.18;
shadow-offset-x = 0;
shadow-offset-y = 8;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
corner-radius = 14;
shadow-exclude = [ "window_type = 'desktop'", "window_type = 'dock'" ];
rounded-corners-exclude = [ "window_type = 'desktop'", "window_type = 'dock'" ];
